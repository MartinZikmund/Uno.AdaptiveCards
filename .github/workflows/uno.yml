name: Uno Platform renderer

on:
  push:
    branches: [ main, 'claude/**' ]
    paths: [ 'source/uno/**', 'samples/**', '.github/workflows/uno.yml' ]
  pull_request:
    paths: [ 'source/uno/**', 'samples/**', '.github/workflows/uno.yml' ]
  workflow_dispatch:

defaults:
  run:
    working-directory: source/uno

jobs:
  linux:
    name: Linux (object model tests, desktop, wasm, android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: source/uno/global.json
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      - name: Install workloads
        run: dotnet workload install android wasm-tools
      - name: Object model tests
        run: dotnet test AdaptiveCards.ObjectModel.Uno.Tests -c Release
      - name: Build renderer (all Linux-buildable targets)
        run: dotnet build AdaptiveCards.Rendering.Uno -c Release -p:EnableMobileTargets=true -p:OverrideTargetFrameworks="net10.0%3Bnet10.0-desktop%3Bnet10.0-browserwasm%3Bnet10.0-android"
      - name: Build visualizer (desktop, wasm, android)
        run: dotnet build AdaptiveCards.Visualizer.Uno -c Release -p:EnableMobileTargets=true -p:OverrideTargetFrameworks="net10.0-desktop%3Bnet10.0-browserwasm%3Bnet10.0-android"
      - name: Interaction self-tests (desktop, headless)
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          dotnet build AdaptiveCards.Visualizer.Uno -c Release -p:OverrideTargetFrameworks=net10.0-desktop
          xvfb-run -a -s "-screen 0 1600x1200x24" dotnet AdaptiveCards.Visualizer.Uno/bin/Release/net10.0-desktop/AdaptiveCards.Visualizer.Uno.dll --selftest "$RUNNER_TEMP/selftest.txt" || (cat "$RUNNER_TEMP/selftest.txt"; exit 1)
          cat "$RUNNER_TEMP/selftest.txt"
      - name: Render all samples (desktop, headless)
        run: |
          xvfb-run -a -s "-screen 0 1600x1200x24" dotnet AdaptiveCards.Visualizer.Uno/bin/Release/net10.0-desktop/AdaptiveCards.Visualizer.Uno.dll --screenshots "$RUNNER_TEMP/screenshots" "v1.6"
          cat "$RUNNER_TEMP/screenshots/render-log.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-desktop
          path: ${{ runner.temp }}/screenshots

  windows:
    name: Windows (WinAppSdk, desktop, android)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: source/uno/global.json
      - name: Install workloads
        run: dotnet workload install android wasm-tools
      - uses: microsoft/setup-msbuild@v2
      # WinUI class libraries containing XAML must be built with msbuild (Uno.Sdk UNOB0008).
      - name: Build renderer
        run: msbuild AdaptiveCards.Rendering.Uno/AdaptiveCards.Rendering.Uno.csproj -restore -p:Configuration=Release -p:OverrideTargetFrameworks="net10.0-windows10.0.26100%3Bnet10.0-desktop%3Bnet10.0-android" -v:m
      - name: Build visualizer (WinAppSdk)
        run: msbuild AdaptiveCards.Visualizer.Uno/AdaptiveCards.Visualizer.Uno.csproj -restore -p:Configuration=Release -p:OverrideTargetFrameworks=net10.0-windows10.0.26100 -v:m

  macos:
    name: macOS (iOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: source/uno/global.json
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Install workloads
        run: dotnet workload install ios
      - name: Build renderer (iOS)
        run: dotnet build AdaptiveCards.Rendering.Uno -c Release -p:OverrideTargetFrameworks=net10.0-ios
      - name: Build visualizer (iOS simulator)
        run: dotnet build AdaptiveCards.Visualizer.Uno -c Release -p:OverrideTargetFrameworks=net10.0-ios -p:RuntimeIdentifier=iossimulator-arm64 -p:ValidateXcodeVersion=false
