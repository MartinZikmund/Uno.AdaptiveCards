name: Uno Platform renderer

on:
  push:
    branches: [ main, 'claude/**' ]
    paths: [ 'source/uno/**', 'samples/**', '.github/workflows/uno.yml' ]
  pull_request:
    paths: [ 'source/uno/**', 'samples/**', '.github/workflows/uno.yml' ]
  workflow_dispatch:

defaults:
  run:
    working-directory: source/uno

jobs:
  linux:
    name: Linux (object model tests, desktop, wasm, android)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: source/uno/global.json
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      - name: Install workloads
        run: dotnet workload install android wasm-tools
      - name: Object model tests
        run: dotnet test AdaptiveCards.ObjectModel.Uno.Tests -c Release
      - name: Build renderer (all Linux-buildable targets)
        run: dotnet build AdaptiveCards.Rendering.Uno -c Release -p:EnableMobileTargets=true -p:OverrideTargetFrameworks="net10.0%3Bnet10.0-desktop%3Bnet10.0-browserwasm%3Bnet10.0-android"
      - name: Build visualizer (desktop, wasm, android)
        run: dotnet build AdaptiveCards.Visualizer.Uno -c Release -p:EnableMobileTargets=true -p:OverrideTargetFrameworks="net10.0-desktop%3Bnet10.0-browserwasm%3Bnet10.0-android"
      - name: Interaction self-tests (desktop, headless)
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb vlc-bin vlc-plugin-base libvlc-dev
          dotnet build AdaptiveCards.Visualizer.Uno -c Release -p:OverrideTargetFrameworks=net10.0-desktop
          # Judge by the report: native components (media player) can crash during X11 teardown after the run.
          xvfb-run -a -s "-screen 0 1600x1200x24" dotnet AdaptiveCards.Visualizer.Uno/bin/Release/net10.0-desktop/AdaptiveCards.Visualizer.Uno.dll --selftest "$RUNNER_TEMP/selftest.txt" || true
          cat "$RUNNER_TEMP/selftest.txt"
          grep -q ", 0 failed" "$RUNNER_TEMP/selftest.txt"
      - name: Interaction self-tests (WebAssembly, headless Chromium)
        run: |
          dotnet publish AdaptiveCards.Visualizer.Uno -c Release -f net10.0-browserwasm -o "$RUNNER_TEMP/wasm"
          (cd "$RUNNER_TEMP/wasm/wwwroot" && python3 -m http.server 8765 >/dev/null 2>&1 &)
          npm install --prefix "$RUNNER_TEMP/pw" playwright@1.49.1
          # Google Chrome (preinstalled on the runner) rather than Playwright's Chromium, which cannot decode H.264.
          PW_CHANNEL=chrome NODE_PATH="$RUNNER_TEMP/pw/node_modules" node ci/wasm-selftest.js http://127.0.0.1:8765/ "$RUNNER_TEMP/wasm-selftest.png"
      - name: Render all samples (desktop, headless)
        run: |
          xvfb-run -a -s "-screen 0 1600x1200x24" dotnet AdaptiveCards.Visualizer.Uno/bin/Release/net10.0-desktop/AdaptiveCards.Visualizer.Uno.dll --screenshots "$RUNNER_TEMP/screenshots" "v1.6"
          cat "$RUNNER_TEMP/screenshots/render-log.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-desktop
          path: ${{ runner.temp }}/screenshots

  android-emulator:
    name: Android emulator (interaction self-tests)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: source/uno/global.json
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install workloads
        run: dotnet workload install android
      - name: Build self-test APK
        run: dotnet build AdaptiveCards.Visualizer.Uno -c Release -p:SelfTestOnLaunch=true -p:EnableMobileTargets=true -p:OverrideTargetFrameworks=net10.0-android -p:AndroidPackageFormat=apk -p:EmbedAssembliesIntoApk=true
      - name: Run self-tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: source/uno
          script: |
            adb install -r AdaptiveCards.Visualizer.Uno/bin/Release/net10.0-android/dev.zikmund.adaptivecards.visualizer-Signed.apk
            adb logcat -c
            adb shell monkey -p dev.zikmund.adaptivecards.visualizer -c android.intent.category.LAUNCHER 1
            for i in $(seq 1 240); do if adb logcat -d | grep -q "SELFTEST DONE"; then break; fi; sleep 5; done
            adb logcat -d | grep "SELFTEST" || true
            adb logcat -d | grep -q "SELFTEST DONE OK" || (echo "app pid: $(adb shell pidof dev.zikmund.adaptivecards.visualizer)"; adb exec-out screencap -p > "$RUNNER_TEMP/android-selftest.png"; adb logcat -d | grep -iE "AndroidRuntime|FATAL|DOTNET|MediaPlayer|monodroid|libc|DEBUG" | tail -400; exit 1)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-selftest-screen
          path: ${{ runner.temp }}/android-selftest.png
          if-no-files-found: ignore

  windows:
    name: Windows (WinAppSdk, desktop, android)
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: source/uno/global.json
      - name: Install workloads
        run: dotnet workload install android wasm-tools
      - uses: microsoft/setup-msbuild@v2
      # WinUI class libraries containing XAML must be built with msbuild (Uno.Sdk UNOB0008).
      - name: Build renderer
        run: msbuild AdaptiveCards.Rendering.Uno/AdaptiveCards.Rendering.Uno.csproj -restore -p:Configuration=Release -p:OverrideTargetFrameworks="net10.0-windows10.0.26100%3Bnet10.0-desktop%3Bnet10.0-android" -v:m
      - name: Build visualizer (WinAppSdk, unpackaged)
        run: msbuild AdaptiveCards.Visualizer.Uno/AdaptiveCards.Visualizer.Uno.csproj -restore -p:Configuration=Release -p:OverrideTargetFrameworks=net10.0-windows10.0.26100 -p:UnpackagedSelfContained=true -v:m
      - name: Interaction self-tests (WinAppSdk)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse AdaptiveCards.Visualizer.Uno/bin/Release/net10.0-windows10.0.26100 -Filter AdaptiveCards.Visualizer.Uno.exe | Select-Object -First 1
          $out = Join-Path $env:RUNNER_TEMP "selftest-winappsdk.txt"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--selftest", "`"$out`"" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "self-tests timed out" }
          $crash = Join-Path $env:TEMP "AdaptiveCards.Visualizer.crash.txt"
          if (Test-Path $crash) { Get-Content $crash }
          Get-Content $out
          if ($p.ExitCode -ne 0) { throw "self-tests failed" }
      - name: Interaction self-tests (Skia desktop, Win32)
        shell: pwsh
        run: |
          dotnet build AdaptiveCards.Visualizer.Uno -c Release -p:OverrideTargetFrameworks=net10.0-desktop
          $out = Join-Path $env:RUNNER_TEMP "selftest-desktop.txt"
          $p = Start-Process -FilePath dotnet -ArgumentList "AdaptiveCards.Visualizer.Uno/bin/Release/net10.0-desktop/AdaptiveCards.Visualizer.Uno.dll", "--selftest", "`"$out`"" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "self-tests timed out" }
          $crash = Join-Path $env:TEMP "AdaptiveCards.Visualizer.crash.txt"
          if (Test-Path $crash) { Get-Content $crash }
          Get-Content $out
          if ($p.ExitCode -ne 0) { throw "self-tests failed" }

  macos:
    name: macOS (iOS)
    runs-on: macos-26
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: source/uno/global.json
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Install workloads
        run: dotnet workload install ios
      - name: Build renderer (iOS)
        run: dotnet build AdaptiveCards.Rendering.Uno -c Release -p:OverrideTargetFrameworks=net10.0-ios
      - name: Build visualizer (iOS simulator, self-test on launch)
        timeout-minutes: 70
        run: dotnet build AdaptiveCards.Visualizer.Uno -c Release -p:OverrideTargetFrameworks=net10.0-ios -p:RuntimeIdentifier=iossimulator-arm64 -p:ValidateXcodeVersion=false -p:SelfTestOnLaunch=true
      - name: Interaction self-tests (iOS simulator)
        timeout-minutes: 30
        run: |
          APP=$(find AdaptiveCards.Visualizer.Uno/bin/Release/net10.0-ios/iossimulator-arm64 -maxdepth 2 -name "*.app" | head -1)
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name']))")
          xcrun simctl boot "$DEVICE"
          xcrun simctl install "$DEVICE" "$APP"
          (xcrun simctl launch --console-pty "$DEVICE" dev.zikmund.adaptivecards.visualizer > "$RUNNER_TEMP/ios.log" 2>&1 &)
          for i in $(seq 1 240); do
            if grep -q "SELFTEST DONE" "$RUNNER_TEMP/ios.log"; then break; fi
            # A test stuck for 3+ minutes will not recover; stop waiting.
            if grep -q "SELFTEST STILL RUNNING .* (1[89][0-9]s)" "$RUNNER_TEMP/ios.log"; then break; fi
            sleep 5
          done
          grep "SELFTEST" "$RUNNER_TEMP/ios.log" || tail -50 "$RUNNER_TEMP/ios.log"
          if ! grep -q "SELFTEST DONE OK" "$RUNNER_TEMP/ios.log"; then
            (xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/ios-selftest.png" & P=$!; sleep 30; kill $P 2>/dev/null) || true
            echo "--- app output (non-SELFTEST) ---"; grep -v "SELFTEST" "$RUNNER_TEMP/ios.log" | tail -150
            echo "--- crash reports ---"; ls -t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head; for f in $(ls -t ~/Library/Logs/DiagnosticReports/*AdaptiveCards* 2>/dev/null | head -1); do head -150 "$f"; done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-selftest-screen
          path: ${{ runner.temp }}/ios-selftest.png
          if-no-files-found: ignore
